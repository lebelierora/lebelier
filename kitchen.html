<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>るべりえ 厨房受付</title>
<link rel="stylesheet" href="css/style.css?v=20251127-94">
<style>
  main{max-width:none;padding:10px 10px 40px;}
  .summary{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);padding:8px 0;}
  .summary .pill{border-radius:999px;padding:10px 20px;font-weight:900;font-size:20px;color:#fff;}
  .pill-pending{background:var(--warn);} .pill-confirmed{background:#7d6608;background-color:#b7950b;}
  .flash-banner{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--warn);color:#fff;font-weight:900;text-align:center;padding:14px;font-size:22px;pointer-events:none;animation:flash 1s steps(2,start) infinite;}
  @keyframes flash{50%{opacity:.35;}}
  .kgrid{display:grid;gap:12px;}
  .density-xl .kgrid{grid-template-columns:repeat(auto-fit,minmax(420px,1fr));}
  .density-lg .kgrid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));}
  .density-md .kgrid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}
  .density-sm .kgrid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .kcard{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .kcard.pending{border-color:var(--warn);animation:flash 1.1s steps(2,start) infinite;}
  .kcard .ptime{font-weight:900;line-height:1.1;}
  .density-xl .ptime{font-size:56px;} .density-lg .ptime{font-size:48px;}
  .density-md .ptime{font-size:40px;} .density-sm .ptime{font-size:34px;}
  .kcard .pdate{font-weight:800;color:var(--muted);}
  .density-xl .pdate{font-size:20px;} .density-sm .pdate{font-size:15px;}
  .kitem{font-weight:900;}
  .density-xl .kitem{font-size:26px;} .density-lg .kitem{font-size:23px;}
  .density-md .kitem{font-size:20px;} .density-sm .kitem{font-size:18px;}
  .kcustom{color:var(--muted);font-weight:700;}
  .density-xl .kcustom{font-size:17px;} .density-sm .kcustom{font-size:13px;}
  .ktotal{text-align:right;font-weight:900;}
  .density-xl .ktotal{font-size:26px;} .density-sm .ktotal{font-size:19px;}
  .badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:900;color:#fff;background:#2e86c1;}
  .badge.first{background:#8e44ad;} .badge.regular{background:#b7950b;}
  .countdown{font-weight:900;color:var(--ok);}
  .countdown.over{color:var(--warn);}
  .adj-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .adj-row button{flex:1 1 30%;min-height:56px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:900;}
  .adj-row button:active{background:#eee;}
  .act-row{display:flex;gap:8px;flex-wrap:wrap;}
  .act-row button{flex:1 1 45%;min-height:56px;}
  .diff-up{color:var(--warn);font-weight:900;} .diff-down{color:#2e86c1;font-weight:900;}
  details.finished{margin-top:18px;}
  details.finished summary{font-weight:900;font-size:17px;cursor:pointer;padding:10px 0;}
  #calls-area{margin:12px 0;}
  .call-card{background:#fdedec;border:3px solid var(--warn);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;animation:flash 1.1s steps(2,start) infinite;}
  .call-seat{font-weight:900;line-height:1.1;}
  .density-xl .call-seat{font-size:52px;} .density-lg .call-seat{font-size:44px;}
  .density-md .call-seat{font-size:38px;} .density-sm .call-seat{font-size:32px;}
  .kind-chip{display:inline-block;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:900;color:#fff;background:#7d6608;}
  .pin-wrap{max-width:360px;margin:60px auto;text-align:center;}
  .pin-wrap input{font-size:28px;text-align:center;letter-spacing:.4em;width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;}
    .setmeal-badge { background:#eafaf1; border:2px solid #27ae60; color:#1e8449; border-radius:10px; padding:6px 10px; font-weight:900; font-size:17px; }
  .sound-banner{background:#eaf2f8;border:3px solid #2e86c1;color:#1a5276;border-radius:14px;padding:12px 16px;font-weight:900;font-size:19px;margin-top:10px;}
  .print-msg{background:#eafaf1;border:3px solid #27ae60;color:#1e8449;border-radius:14px;padding:12px 16px;font-weight:900;font-size:19px;margin-top:10px;}
  .print-msg.fail{background:#fdedec;border-color:var(--warn);color:#922b21;}
  .print-warn{background:#fdedec;border:2px solid var(--warn);color:#922b21;border-radius:10px;padding:6px 10px;font-weight:900;font-size:17px;}
  .print-flash-btn{flex:1;min-height:64px;border:none;border-radius:12px;background:var(--warn);color:#fff;font-size:22px;font-weight:900;animation:flash 1.1s steps(2,start) infinite;cursor:pointer;}
  </style>
</head>
<body>
<header class="top">
  <h1>るべりえ 厨房受付</h1>
  <span class="test-badge">テスト公開中</span>
  <div class="sub">テイクアウト注文と店内オーダーの受付画面です。新しい注文・呼び出しは自動で表示されます。</div>
</header>

<!-- ログインフォーム（Firebase Auth） -->
<section id="pin-gate" class="pin-wrap">
  <div class="card">
    <h2 style="margin-top:0;">厨房受付ログイン</h2>
    <p class="note">メールアドレスとパスワードを入力してください。</p>
    <input id="login-email" type="email" autocomplete="username" value="lebelier.ora@gmail.com" style="font-size:17px;letter-spacing:normal;text-align:left;margin-top:8px;">
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="パスワード" style="font-size:17px;letter-spacing:normal;text-align:left;margin-top:10px;">
    <button class="btn" id="login-btn" style="margin-top:14px;">ログイン</button>
    <div id="login-error"></div>
  </div>
</section>

<main id="kitchen-main" class="hidden density-lg">
  <div class="summary">
    <span class="pill pill-pending" id="sum-pending">未受付 0件</span>
    <span class="pill pill-confirmed" id="sum-confirmed">対応中 0件</span>
    <button class="btn ghost small" id="sound-btn">音を有効にする</button>
    <button class="btn ghost small" id="logout-btn">ログアウト</button>
    <span class="note" id="sound-state">音声：未設定（ボタンを押すと鳴るようになります）</span>
  </div>
  <div id="sound-banner" class="sound-banner hidden">音が出ない状態です。画面をタップすると音が有効になります</div>
  <div id="print-msg" class="print-msg hidden"></div>
  <div class="tabs" id="kind-tabs" style="margin-top:4px;">
    <button data-tab="all" class="active">すべて</button>
    <button data-tab="dinein">店内</button>
    <button data-tab="takeout">テイクアウト</button>
    <button data-tab="frozen">冷凍予約</button>
  </div>
  <div id="calls-area" class="hidden"></div>
  <div id="order-grid" class="kgrid"></div>
  <p class="note hidden" id="no-orders" style="font-size:17px;margin-top:20px;">現在、対応中の注文はありません。</p>

  <details class="finished">
    <summary>完了した注文（お渡し済み・提供済み・来店なし）</summary>
    <div id="finished-list" class="kgrid" style="margin-top:10px;"></div>
  </details>

  <details class="finished">
    <summary>要注意リスト（ブロック中の電話番号）</summary>
    <div id="blocked-list" style="margin-top:10px;"></div>
  </details>
</main>

<div class="flash-banner hidden" id="flash-banner">新しい注文があります</div>
<audio id="order-sound" src="audio/moko-order-v2.mp3" preload="auto"></audio>
<audio id="call-sound" src="audio/moko-call-v2.mp3" preload="auto"></audio>

<script type="module" src="js/kitchen.js?v=20251127-102"></script>
</body>
</html>
